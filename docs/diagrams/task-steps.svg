<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 848" width="1280" height="848" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf3fd"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0a1e46" flood-opacity=".10"/></filter>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9fb0c8"/></marker>
  <style>
    .t{fill:#0e0f12;font-weight:700;font-size:17px} .s{fill:#4b4a50;font-size:13.5px} .lab{fill:#5b6170;font-size:12.5px;font-weight:600}
    .edge{fill:none;stroke:#9fb0c8;stroke-width:1.6} .flow{fill:none;stroke-width:2.2;stroke-dasharray:6 10;animation:run 1.6s linear infinite}
    .life{stroke:#c9d4e3;stroke-width:1.4;stroke-dasharray:4 6}
    @keyframes run{to{stroke-dashoffset:-32}}
  </style>
</defs>
<rect width="1280" height="848" rx="28" fill="url(#sky)"/>
<text x="40" y="54" style="fill:#0e0f12;font-size:26px;font-weight:800;letter-spacing:-.02em">A task, step by step</text>
<text x="40" y="80" class="s" style="font-size:14px">Bisi asks in Yorùbá for UNILAG's Computer Science requirements. Proof first, then the answer in her own language.</text>

<line x1="120" y1="160" x2="120" y2="808" class="life"/>
<rect x="40" y="108" width="160" height="46" rx="16" fill="#fff" stroke="#1a7f45" stroke-width="1.8" filter="url(#sh)"/>
<text x="120" y="137" text-anchor="middle" class="t" style="font-size:14.5px">Bisi (Yorùbá)</text>
<line x1="293" y1="160" x2="293" y2="808" class="life"/>
<rect x="213" y="108" width="160" height="46" rx="16" fill="#fff" stroke="#1d63ed" stroke-width="1.8" filter="url(#sh)"/>
<text x="293" y="137" text-anchor="middle" class="t" style="font-size:14.5px">Jagora app</text>
