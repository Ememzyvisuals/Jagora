<circle cx="466" cy="328" r="12" fill="#1d63ed"/><text x="466" y="332.5" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:12px">4</text>
<text x="486" y="319" text-anchor="start" class="lab" style="fill:#2a2c33;font-size:13px">her goal, the page and the tools</text>
