<path d="M482 282 L633 282" class="flow" style="stroke:#1d63ed"/>
<circle cx="466" cy="282" r="12" fill="#1d63ed"/><text x="466" y="286.5" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:12px">3</text>
<text x="486" y="273" text-anchor="start" class="lab" style="fill:#2a2c33;font-size:13px">transcribe (Yorùbá)</text>
