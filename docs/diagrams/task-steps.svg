<path d="M450 466 L299 466" class="flow" style="stroke:#1a7f45"/>
<circle cx="466" cy="466" r="12" fill="#1a7f45"/><text x="466" y="470.5" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:12px">7</text>
<text x="446" y="457" text-anchor="end" class="lab" style="fill:#2a2c33;font-size:13px">the live page, as video</text>
<path d="M796 512 L472 512" class="edge" marker-end="url(#arr)" />
<path d="M796 512 L472 512" class="flow" style="stroke:#1d63ed"/>
<circle cx="812" cy="512" r="12" fill="#1d63ed"/><text x="812" y="516.5" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:12px">8</text>
<text x="792" y="503" text-anchor="end" class="lab" style="fill:#2a2c33;font-size:13px">find_text, then show_evidence</text>
