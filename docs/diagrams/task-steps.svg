<rect x="386" y="108" width="160" height="46" rx="16" fill="#fff" stroke="#0e0f12" stroke-width="1.8" filter="url(#sh)"/>
<text x="466" y="137" text-anchor="middle" class="t" style="font-size:14.5px">Agent server</text>
<line x1="639" y1="160" x2="639" y2="808" class="life"/>
<rect x="559" y="108" width="160" height="46" rx="16" fill="#fff" stroke="#d97706" stroke-width="1.8" filter="url(#sh)"/>
<text x="639" y="137" text-anchor="middle" class="t" style="font-size:14.5px">STORM speech</text>
<line x1="812" y1="160" x2="812" y2="808" class="life"/>
<rect x="732" y="108" width="160" height="46" rx="16" fill="#fff" stroke="#1d63ed" stroke-width="1.8" filter="url(#sh)"/>
<text x="812" y="137" text-anchor="middle" class="t" style="font-size:14.5px">Muse Spark</text>
<line x1="985" y1="160" x2="985" y2="808" class="life"/>
<rect x="905" y="108" width="160" height="46" rx="16" fill="#fff" stroke="#c4361a" stroke-width="1.8" filter="url(#sh)"/>
<text x="985" y="137" text-anchor="middle" class="t" style="font-size:14.5px">Guard and gate</text>
<line x1="1158" y1="160" x2="1158" y2="808" class="life"/>
<rect x="1078" y="108" width="160" height="46" rx="16" fill="#fff" stroke="#4b4a50" stroke-width="1.8" filter="url(#sh)"/>
<text x="1158" y="137" text-anchor="middle" class="t" style="font-size:14.5px">UNILAG site</text>
<path d="M136 190 L287 190" class="edge" marker-end="url(#arr)" />
<path d="M136 190 L287 190" class="flow" style="stroke:#1d63ed"/>
