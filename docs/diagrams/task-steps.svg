<circle cx="812" cy="374" r="12" fill="#1d63ed"/><text x="812" y="378.5" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:12px">5</text>
<text x="832" y="365" text-anchor="start" class="lab" style="fill:#2a2c33;font-size:13px">go_to the official brochure</text>
<path d="M1001 420 L1152 420" class="edge" marker-end="url(#arr)" />
<path d="M1001 420 L1152 420" class="flow" style="stroke:#1d63ed"/>
<circle cx="985" cy="420" r="12" fill="#1d63ed"/><text x="985" y="424.5" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:12px">6</text>
<text x="1005" y="411" text-anchor="start" class="lab" style="fill:#2a2c33;font-size:13px">allowed: official .edu.ng site</text>
