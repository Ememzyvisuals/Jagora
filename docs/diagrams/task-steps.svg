<path d="M450 558 L299 558" class="flow" style="stroke:#1a7f45"/>
<circle cx="466" cy="558" r="12" fill="#1a7f45"/><text x="466" y="562.5" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:12px">9</text>
<text x="446" y="549" text-anchor="end" class="lab" style="fill:#2a2c33;font-size:13px">evidence card with the exact line highlighted</text>
<path d="M796 604 L472 604" class="edge" marker-end="url(#arr)" />
<path d="M796 604 L472 604" class="flow" style="stroke:#1d63ed"/>
<circle cx="812" cy="604" r="12" fill="#1d63ed"/><text x="812" y="608.5" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:12px">10</text>
<text x="792" y="595" text-anchor="end" class="lab" style="fill:#2a2c33;font-size:13px">finish</text>
<path d="M482 650 L806 650" class="edge" marker-end="url(#arr)" />
<path d="M482 650 L806 650" class="flow" style="stroke:#1d63ed"/>
<circle cx="466" cy="650" r="12" fill="#1d63ed"/><text x="466" y="654.5" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:12px">11</text>
<text x="486" y="641" text-anchor="start" class="lab" style="fill:#2a2c33;font-size:13px">independent checker: is it really done?</text>
<path d="M482 696 L633 696" class="edge" marker-end="url(#arr)" />
<path d="M482 696 L633 696" class="flow" style="stroke:#1d63ed"/>
<circle cx="466" cy="696" r="12" fill="#1d63ed"/><text x="466" y="700.5" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:12px">12</text>
<text x="486" y="687" text-anchor="start" class="lab" style="fill:#2a2c33;font-size:13px">speak the answer in Morenike's voice</text>
<path d="M623 742 L126 742" class="edge" marker-end="url(#arr)" stroke-dasharray="5 5"/>
<path d="M623 742 L126 742" class="flow" style="stroke:#1a7f45"/>
<circle cx="639" cy="742" r="12" fill="#1a7f45"/><text x="639" y="746.5" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:12px">13</text>
<text x="619" y="733" text-anchor="end" class="lab" style="fill:#2a2c33;font-size:13px">the answer, in Yorùbá</text>
