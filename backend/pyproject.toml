[project]
name = "jagora"
version = "0.1.0"
description = "Jagora backend: a voice-first web agent for Yoruba, Hausa, Igbo, Pidgin and English speakers, on Meta's Muse Spark."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "playwright>=1.47",
  "openai>=1.40",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "pillow>=10",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "pywebpush>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jagora*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
