<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf3fd"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0a1e46" flood-opacity=".10"/></filter>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9fb0c8"/></marker>
  <style>
    .t{fill:#0e0f12;font-weight:700;font-size:15px} .s{fill:#4b4a50;font-size:12.5px} .k{fill:#8b8a91;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
    .edge{fill:none;stroke:#9fb0c8;stroke-width:1.6} .flow{fill:none;stroke-width:2.2;stroke-dasharray:6 10;animation:run 1.6s linear infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite} .lab{fill:#8b8a91;font-size:11px;font-weight:600}
    @keyframes run{to{stroke-dashoffset:-32}} @keyframes pulse{0%,100%{stroke-opacity:.25}50%{stroke-opacity:1}}
  </style>
</defs>
<rect width="1280" height="640" rx="28" fill="url(#sky)"/>
<text x="40" y="54" style="fill:#0e0f12;font-size:26px;font-weight:800;letter-spacing:-.02em">Inside the browser · one turn of the agent loop</text>
<text x="40" y="80" class="s" style="font-size:14px">Every step Jagora takes on a real website goes round this loop, until an independent checker agrees the task is done.</text>

<rect x="40" y="128" width="222" height="330" rx="20" fill="#fff" stroke="#d6deea" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="70" cy="162" r="15" fill="#1d63ed"/><text x="70" y="167" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:14px">1</text>
<text x="94" y="168" class="t" style="font-size:19px">Observe</text>
<text x="60" y="212" class="s" style="font-size:13.5px">Invisible text hidden</text>
<text x="60" y="248" class="s" style="font-size:13.5px">(white, tiny, off-screen)</text>
<text x="60" y="284" class="s" style="font-size:13.5px">Every control numbered:</text>
<text x="60" y="320" class="s" style="font-size:13.5px">hidden behind pop-ups skipped</text>
<text x="60" y="356" class="s" style="font-size:13.5px">Screenshot with marks</text>
<text x="60" y="392" class="s" style="font-size:13.5px">Orders to AI cut out</text>
<path id="a0" d="M264 162 L 282 162" class="edge" marker-end="url(#arr)"/><path d="M264 162 L 282 162" class="flow" style="stroke:#1d63ed"/>
<rect x="284" y="128" width="222" height="330" rx="20" fill="#fff" stroke="#d6deea" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="314" cy="162" r="15" fill="#0467DF"/><text x="314" y="167" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:14px">2</text>
<text x="338" y="168" class="t" style="font-size:19px">Think</text>
<text x="304" y="212" class="s" style="font-size:13.5px">Muse Spark 1.3</text>
<text x="304" y="248" class="s" style="font-size:13.5px">57 tools, batched</text>
<text x="304" y="284" class="s" style="font-size:13.5px">Plan kept current</text>
<text x="304" y="320" class="s" style="font-size:13.5px">Learned skills for</text>
<text x="304" y="356" class="s" style="font-size:13.5px">this site as a guide</text>
<text x="304" y="392" class="s" style="font-size:13.5px">Her words over the page's</text>
<path id="a1" d="M508 162 L 526 162" class="edge" marker-end="url(#arr)"/><path d="M508 162 L 526 162" class="flow" style="stroke:#0467DF"/>
<rect x="528" y="128" width="222" height="330" rx="20" fill="#fff" stroke="#d6deea" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="558" cy="162" r="15" fill="#c2352f"/><text x="558" y="167" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:14px">3</text>
<text x="582" y="168" class="t" style="font-size:19px">Gate</text>
<text x="548" y="212" class="s" style="font-size:13.5px">Blocked sites never load</text>
<text x="548" y="248" class="s" style="font-size:13.5px">Secrets: her private box</text>
<text x="548" y="284" class="s" style="font-size:13.5px">Action check vs. her</text>
<text x="548" y="320" class="s" style="font-size:13.5px">request (open weights)</text>
<text x="548" y="356" class="s" style="font-size:13.5px">Submit, pay, agree:</text>
<text x="548" y="392" class="s" style="font-size:13.5px">waits for her yes</text>
<path id="a2" d="M752 162 L 770 162" class="edge" marker-end="url(#arr)"/><path d="M752 162 L 770 162" class="flow" style="stroke:#c2352f"/>
<rect x="772" y="128" width="222" height="330" rx="20" fill="#fff" stroke="#d6deea" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="802" cy="162" r="15" fill="#2f8f57"/><text x="802" y="167" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:14px">4</text>
<text x="826" y="168" class="t" style="font-size:19px">Act</text>
<text x="792" y="212" class="s" style="font-size:13.5px">Playwright in Chromium</text>
<text x="792" y="248" class="s" style="font-size:13.5px">Clicks with fallbacks, drag</text>
<text x="792" y="284" class="s" style="font-size:13.5px">Typing read back</text>
<text x="792" y="320" class="s" style="font-size:13.5px">Uploads, dates, keys</text>
<text x="792" y="356" class="s" style="font-size:13.5px">Cursor shown to her</text>
<text x="792" y="392" class="s" style="font-size:13.5px">Live frames at 5 fps</text>
<path id="a3" d="M996 162 L 1014 162" class="edge" marker-end="url(#arr)"/><path d="M996 162 L 1014 162" class="flow" style="stroke:#2f8f57"/>
<rect x="1016" y="128" width="222" height="330" rx="20" fill="#fff" stroke="#d6deea" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="1046" cy="162" r="15" fill="#d9821e"/><text x="1046" y="167" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:14px">5</text>
<text x="1070" y="168" class="t" style="font-size:19px">Verify</text>
<text x="1036" y="212" class="s" style="font-size:13.5px">Receipt for each action:</text>
<text x="1036" y="248" class="s" style="font-size:13.5px">URL, value, page diff</text>
<text x="1036" y="284" class="s" style="font-size:13.5px">Evidence from source</text>
<text x="1036" y="320" class="s" style="font-size:13.5px">Failures: step back,</text>
<text x="1036" y="356" class="s" style="font-size:13.5px">try another way</text>
<text x="1036" y="392" class="s" style="font-size:13.5px">Checker before 'done'</text>
<rect x="36" y="124" width="230" height="338" rx="23" fill="none" stroke-width="3" stroke="#1d63ed"><animate attributeName="x" values="36;280;524;768;1012" dur="6s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="stroke" values="#1d63ed;#0467DF;#c2352f;#2f8f57;#d9821e" dur="6s" calcMode="discrete" repeatCount="indefinite"/></rect>
<path id="back" d="M1127.0 460 C 1127.0 518, 1067.0 518, 639.0 518 C 211.0 518, 151.0 518, 151.0 462" class="edge" marker-end="url(#arr)"/><path d="M1127.0 460 C 1127.0 518, 1067.0 518, 639.0 518 C 211.0 518, 151.0 518, 151.0 462" class="flow" style="stroke:#1d63ed"/>
<circle r="5" fill="#1d63ed" opacity="0"><animateMotion dur="3.0s" begin="0.0s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#back"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.0s" begin="0.0s" repeatCount="indefinite"/></circle>
<text x="639.0" y="544" text-anchor="middle" class="lab" style="font-size:12.5px">next turn: the page is read again, old page text is shortened, her new words go first</text>
<rect x="980" y="576" width="260" height="38" rx="19" fill="#0e0f12"/><text x="1110" y="600" text-anchor="middle" style="fill:#fff;font-size:13px;font-weight:700">finish → independent checker → her</text>
</svg>